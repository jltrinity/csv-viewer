services:
  csv-viewer:
    build: .
    ports:
      - "127.0.0.1:5000:5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/', timeout=5).close()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
